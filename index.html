/* HUD inspirado na referência enviada: molduras inclinadas e barras segmentadas. */
.side,.side:last-child{background:transparent;padding:5px 7% 5px 15%;border:0;box-shadow:none;line-height:1.05}
.side:last-child{padding:5px 15% 5px 7%}
.side::before,.side:last-child::before{inset:1px;background:linear-gradient(180deg,#020309f5,#131420f5 54%,#05060bf5);border:2px solid #d9deeb;clip-path:polygon(5% 0,100% 0,95% 100%,0 100%);filter:drop-shadow(0 2px 2px #000)}
.side:last-child::before{clip-path:polygon(0 0,95% 0,100% 100%,5% 100%)}
.side .portrait{left:1.5%;bottom:8%;width:12%;stroke:var(--meter);stroke-width:3.4;filter:drop-shadow(2px 2px 0 #000)}
.side:last-child .portrait{left:auto;right:1.5%}
.side .fighter-name{color:#f6f7ff;text-transform:uppercase;letter-spacing:.045em;text-shadow:1px 2px 2px #000;font-size:clamp(7px,1vw,10px);margin-bottom:2px}
.side.danger .fighter-name{color:#ff505d}
.side .bar{height:clamp(8px,1.4vw,13px);background:#040509;border:2px solid #aeb3c1;clip-path:polygon(2% 0,100% 0,98% 100%,0 100%);margin:2px 0 1px;box-shadow:0 1px 2px #000}
.side .bar i{background:repeating-linear-gradient(90deg,transparent 0 19px,#080a10 19px 22px),linear-gradient(180deg,#ffffff88 0,#ffffff20 28%,transparent 55%),var(--meter);filter:saturate(1.15)}
.side:first-child .bar i{background:repeating-linear-gradient(90deg,transparent 0 19px,#080a10 19px 22px),linear-gradient(180deg,#ffffff88 0,#ffffff20 28%,transparent 55%),linear-gradient(90deg,#7187b7,var(--meter))}
.side:last-child .bar i{background:repeating-linear-gradient(90deg,transparent 0 19px,#080a10 19px 22px),linear-gradient(180deg,#ffffff88 0,#ffffff20 28%,transparent 55%),linear-gradient(90deg,#b21d31,var(--meter))}
.side meter{height:5px;border:1px solid #aeb3c1;border-radius:0;background:#040509;appearance:none}
.side meter::-webkit-meter-bar{background:#040509;border:0;border-radius:0}
.side:first-child meter::-webkit-meter-optimum-value{background:linear-gradient(180deg,#bfcbe5,#5074ad)}
.side:last-child meter::-webkit-meter-optimum-value{background:linear-gradient(180deg,#ff9e99,#d32942)}
.energy-label{color:#e5e8f4;text-shadow:1px 1px #000;font-weight:900}
.side.danger::before{background:linear-gradient(180deg,#22080ef5,#180c16f5);border-color:#ff5965}
.side.danger .bar{border-color:#ff5965}

/* HUD redesenhado para acompanhar de perto a referência enviada. */
.hud{left:1.7%;right:1.7%;bottom:1.8%;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:3%;align-items:end}
.side,.side:last-child{min-height:72px;padding:7px 8% 6px 18%;line-height:1;overflow:visible}
.side:last-child{padding:7px 18% 6px 8%}
.side::before,.side:last-child::before{content:"";position:absolute;inset:5px 0 2px;z-index:-1;background:linear-gradient(180deg,#07080df7,#13141df7 53%,#030409f9);border:3px solid #090b10;clip-path:polygon(5% 0,100% 0,94% 100%,0 100%);filter:drop-shadow(0 0 0 #e6e9f1) drop-shadow(0 3px 2px #000)}
.side:last-child::before{clip-path:polygon(0 0,95% 0,100% 100%,5% 100%)}
/* La línea blanca y los nodos circulares de la referencia */
.side::after,.side:last-child::after{content:"";position:absolute;z-index:2;pointer-events:none;top:-2px;left:57%;width:39%;height:22px;background:radial-gradient(circle at 14% 64%,#f9fbff 0 6px,#858b99 7px,transparent 8px),radial-gradient(circle at 62% 39%,#fff 0 7px,#9ca2b1 8px,transparent 9px),linear-gradient(10deg,transparent 46%,#f8f9ff 48% 54%,transparent 56%);filter:drop-shadow(1px 2px 1px #000)}
.side:last-child::after{left:5%;width:42%;background:radial-gradient(circle at 34% 37%,#fff 0 7px,#9ca2b1 8px,transparent 9px),radial-gradient(circle at 79% 63%,#f9fbff 0 6px,#858b99 7px,transparent 8px),linear-gradient(-10deg,transparent 46%,#f8f9ff 48% 54%,transparent 56%)}
.side .portrait{left:2%;bottom:13%;width:15%;max-height:64%;stroke:#7585b3;stroke-width:3.2;filter:drop-shadow(2px 2px 1px #000)}
.side:last-child .portrait{left:auto;right:2%;stroke:#ff3b44;transform:scaleX(-1)}
.side .fighter-name{font-size:clamp(8px,1.1vw,12px);line-height:1.05;text-transform:uppercase;letter-spacing:.055em;text-shadow:1px 2px 2px #000;margin:0 0 2px}
.side:first-child .fighter-name{color:#cbd7ff}
.side:last-child .fighter-name{color:#ffb2bb}
.side #hp1,.side #hp2{display:inline-block;font-size:clamp(9px,1.2vw,13px);font-weight:1000;text-shadow:1px 2px #000}
.side.danger #hp1,.side.danger #hp2{color:#ff2638;text-transform:uppercase;letter-spacing:.05em}
.side .bar{position:relative;height:clamp(13px,1.9vw,20px);margin:2px 0 2px;padding:2px;background:#030407;border:2px solid #dce2f0;clip-path:polygon(3% 0,100% 0,97% 100%,0 100%);box-shadow:0 2px 3px #000}
.side .bar i{height:100%;background:repeating-linear-gradient(90deg,transparent 0 24px,#080a11 24px 28px),linear-gradient(180deg,#fff9 0,#ffffff20 38%,transparent 60%),linear-gradient(90deg,#6879a5,#b3c6ed);filter:saturate(.85)}
.side:last-child .bar i{background:repeating-linear-gradient(90deg,transparent 0 24px,#080a11 24px 28px),linear-gradient(180deg,#fff9 0,#ffffff20 38%,transparent 60%),linear-gradient(90deg,#ee2836,#971220)}
.side meter{height:5px;border:1px solid #dce2f0;border-radius:0;background:#020307;appearance:none}
.side meter::-webkit-meter-bar{background:#020307;border:0;border-radius:0}
.side:first-child meter::-webkit-meter-optimum-value{background:linear-gradient(180deg,#e8efff,#637fb5)}
.side:last-child meter::-webkit-meter-optimum-value{background:linear-gradient(180deg,#ffdbdc,#ef4050)}
.side .energy-label{font-size:7px;line-height:1;margin-top:1px;letter-spacing:.1em;color:#dfe5f7;text-shadow:1px 1px #000}
.side.danger::before{background:linear-gradient(180deg,#13080cf7,#330812f7 56%,#090307f9);border-color:#ff283a}
.side.danger .bar{border-color:#ff3a48}
@media(max-width:520px){.hud{left:1%;right:1%;gap:2%}.side,.side:last-child{min-height:63px;padding-top:6px}.side .portrait{width:13%}.side::after,.side:last-child::after{width:34%}}
