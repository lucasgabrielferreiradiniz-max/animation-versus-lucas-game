<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10141c"><title>Animation Versus Fã</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10141c;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overscroll-behavior:none}#bootSplash,#bootLoad{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}#bootSplash{background:#f89a2a;transition:opacity .55s ease,visibility .55s ease}#bootSplash.is-gone{opacity:0;visibility:hidden;pointer-events:none}#bootSplash img{width:100%;height:100%;object-fit:contain;object-position:center}#bootLoad{display:none;background:radial-gradient(ellipse at 50% 18%,#324a69 0,#182336 50%,#080c14 100%);padding:18px}#bootLoad.is-open{display:grid}.boot-panel{width:min(90vw,540px);padding:clamp(20px,5vw,40px);text-align:center;background:linear-gradient(160deg,#172133f5,#080d18f7);border:2px solid #b9c9df;border-radius:14px;box-shadow:0 0 0 3px #121824,0 12px 44px #000b,inset 0 0 22px #8bb9ff18}.boot-logo{display:grid;justify-items:center;margin:0 auto 15px;transform:skew(-7deg);filter:drop-shadow(0 6px 2px #17121d)}.boot-logo span{font-size:clamp(20px,5vw,36px);font-weight:1000;font-style:italic;letter-spacing:.18em;color:#eaf0ff;text-shadow:2px 3px #252c3a}.boot-logo strong{font-size:clamp(43px,12vw,92px);font-weight:1000;font-style:italic;letter-spacing:-.06em;line-height:.92;color:#ffb25d;text-shadow:3px 4px #863719,6px 8px #100b13}.boot-message{margin:8px 0 14px;font-size:clamp(15px,3.5vw,20px);font-weight:800}.boot-dots{display:inline-flex;min-width:1.4em;text-align:left}.boot-dots i{font-style:normal;opacity:.2;animation:dot .9s ease-in-out infinite}.boot-dots i:nth-child(2){animation-delay:.16s}.boot-dots i:nth-child(3){animation-delay:.32s}@keyframes dot{0%,100%{opacity:.2;transform:translateY(0)}45%{opacity:1;transform:translateY(-3px)}}.boot-track{height:14px;padding:2px;border:1px solid #c3d0e4;border-radius:9px;background:#050810;box-shadow:inset 0 2px 5px #000}.boot-track i{display:block;width:0;height:100%;border-radius:6px;background:linear-gradient(180deg,#fff1ad,#ffbd56 45%,#da692e);box-shadow:0 0 12px #ffae48;transition:width .08s linear}#bootStats{margin:10px 0 0;color:#e7eef9;font-size:clamp(13px,3vw,16px);font-weight:800;font-variant-numeric:tabular-nums}#bootError{margin:12px 0 0;color:#ffe3a3;font-size:14px}#bootRetry{display:none;margin-top:12px;padding:10px 18px;border:0;border-radius:8px;background:#ffcf69;color:#20160b;font-weight:900}@media(max-height:460px){#bootLoad{padding:8px}.boot-panel{padding:12px 22px}.boot-logo{margin-bottom:5px}.boot-logo span{font-size:18px}.boot-logo strong{font-size:38px}.boot-message{margin:5px 0 8px}}
</style></head><body>
<section id="bootSplash" aria-label="Abertura Radical Mobile"><img id="bootSplashImage" alt=""></section>
<section id="bootLoad" aria-live="polite"><div class="boot-panel"><h1 class="boot-logo"><span>ANIMATION</span><strong>VERSUS FÃ</strong></h1><p class="boot-message">Baixando recursos, aguarde<span class="boot-dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span></p><div class="boot-track" role="progressbar" aria-label="Recursos iniciais carregados" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="bootBar"></i></div><p id="bootStats">0,00 / 1.25 MB · 0,00 MB/s</p><p id="bootError" hidden></p><button id="bootRetry" type="button">Tentar novamente</button></div></section>
<script>
(()=>{
 const SIZES={splash:37609,game:1130012,peer:86948};
 const TOTAL=SIZES.splash+SIZES.game+SIZES.peer;
 const splash=document.getElementById('bootSplash'), splashImg=document.getElementById('bootSplashImage'), load=document.getElementById('bootLoad'), bar=document.getElementById('bootBar'), track=document.querySelector('.boot-track'), stats=document.getElementById('bootStats'), error=document.getElementById('bootError'), retry=document.getElementById('bootRetry');
 let totalBytes=TOTAL,splashLoaded=0,coreLoaded=0,coreStarted=0,started=false,coverObjectUrl='';
 const fmt=n=>(n/1e6).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}),fmtSpeed=n=>n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
 function paint(){const n=Math.min(totalBytes,splashLoaded+coreLoaded),pct=totalBytes?Math.min(100,n/totalBytes*100):0;bar.style.width=pct+'%';track.setAttribute('aria-valuenow',String(Math.floor(pct)));const sec=coreStarted?Math.max(.15,(performance.now()-coreStarted)/1000):.15;const rate=coreLoaded/1e6/sec;stats.textContent=fmt(n)+' / '+fmt(totalBytes)+' MB · '+fmtSpeed(rate)+' MB/s'}
 async function readAsset(url,onBytes){const r=await fetch(url,{cache:'no-cache'});if(!r.ok)throw Error('HTTP '+r.status+' ao baixar '+url);if(!r.body)throw Error('O navegador não disponibilizou o fluxo de '+url);const reader=r.body.getReader(),chunks=[];let size=0;for(;;){const q=await reader.read();if(q.done)break;chunks.push(q.value);size+=q.value.byteLength;onBytes(q.value.byteLength)}const out=new Uint8Array(size);let at=0;for(const c of chunks){out.set(c,at);at+=c.byteLength}return out}
 const coverPromise=readAsset('./covers/radical-mobile-opening.jpg',n=>{splashLoaded+=n;paint()}).then(bytes=>{coverObjectUrl=URL.createObjectURL(new Blob([bytes],{type:'image/jpeg'}));splashImg.src=coverObjectUrl;return bytes}).catch(()=>{totalBytes-=SIZES.splash;paint();splashImg.src='./covers/radical-mobile-opening.jpg';return null});
 async function loadGame(){if(started)return;started=true;retry.style.display='none';error.hidden=true;coreStarted=performance.now();coreLoaded=0;paint();
  try{
   const [cover,game,peerResult]=await Promise.all([coverPromise,readAsset('./game.html',n=>{coreLoaded+=n;paint()}),readAsset('https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js',n=>{coreLoaded+=n;paint()}).then(bytes=>({bytes})).catch(()=>({bytes:null}))]);
   if(cover)splashLoaded=cover.byteLength;
   let html=new TextDecoder('utf-8').decode(game);
   const peerTag=/<script\s+src=["']https:\/\/unpkg\.com\/peerjs@1\.5\.5\/dist\/peerjs\.min\.js["']><\/script>/i;
   if(peerResult.bytes){
    if(!peerTag.test(html))throw Error('Não encontrei a biblioteca de conexão do jogo.');
    const safePeer=new TextDecoder('utf-8').decode(peerResult.bytes).replace(/<\/script/gi,'<\\/script');
    html=html.replace(peerTag,'<script>'+safePeer+'<\/script>');
   }else totalBytes-=SIZES.peer;
   if(coverObjectUrl)html=html.replace('src="./covers/radical-mobile-opening.jpg"','src="'+coverObjectUrl+'"');
   paint();
   const bootStart="setup();mode('intro',false);const splash=$('splash'),gameLogoIntro=$('gameLogoIntro');if(!window.__AVF_BOOT_RESOURCES_LOADED__&&splash){";
   const oldStart="setup();mode('intro',false);const splash=$('splash'),gameLogoIntro=$('gameLogoIntro');if(splash){";
   if(!html.includes(oldStart))throw Error('Não encontrei o início normal do jogo.');
   html=html.replace(oldStart,bootStart);
   const loginNeedle="if(google)google.addEventListener('click',()=>{if(notice)notice.hidden=false;});\n})();";
   const loginReplace="if(google)google.addEventListener('click',()=>{if(notice)notice.hidden=false;});\n if(window.__AVF_BOOT_RESOURCES_LOADED__){const splash=document.getElementById('splash');if(splash)splash.classList.add('splash-done');window.showLoginGate();}\n})();";
   if(!html.includes(loginNeedle))throw Error('Não encontrei a tela de entrada do jogo.');
   html=html.replace(loginNeedle,loginReplace);
   html=html.replace('<head>','<head><script>window.__AVF_BOOT_RESOURCES_LOADED__=true;<\/script>',1);
   setTimeout(()=>{document.open();document.write(html);document.close()},250);
  }catch(e){started=false;error.textContent='Não consegui carregar os recursos: '+String(e.message||e);error.hidden=false;retry.style.display='inline-block';}
 }
 retry.addEventListener('click',loadGame);
 setTimeout(()=>{splash.classList.add('is-gone');load.classList.add('is-open');loadGame()},4000);
 paint();
})();
</script></body></html>
